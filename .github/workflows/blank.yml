name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sap xep thu muc project
        run: |
          mkdir -p app/src/main/java/com/dlsbot app/src/main/res/xml app/src/main/res/values
          mv app.build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv accessibility_config.xml app/src/main/res/xml/accessibility_config.xml
          mv strings.xml app/src/main/res/values/strings.xml
          mv Main.kt app/src/main/java/com/dlsbot/Main.kt
          mv Bot.kt app/src/main/java/com/dlsbot/Bot.kt

      - name: Cai Android SDK 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dls-bot-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Tao Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DLS Bot build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
